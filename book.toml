[book]
title = "The keryx Book"
authors = ["Gregory Gelfond"]
language = "en"
src = "docs/book"
description = "Compiling Protocol Buffers into an Answer Set Programming vocabulary, and translating messages to ground facts and back."

[build]
build-dir = "target/book"

[rust]
edition = "2024"

[output.html]
git-repository-url = "https://github.com/GregoryGelfond/keryx"
edit-url-template = "https://github.com/GregoryGelfond/keryx/edit/main/{path}"
smart-punctuation = true
