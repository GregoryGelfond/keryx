[package]
name = "keryx-core"
version = "0.1.0"
description = "The solver-free core of keryx: the protobuf-schema-to-ASP-vocabulary compiler and the protobuf-message-to-ground-facts codec, over themelios's Symbol algebra."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The arm's-length dependency on the themelios program tier, pinned to the
# consolidated rev. themelios is a public repo, so this fetches over HTTPS with
# no credentials. keryx never modifies themelios; gaps go to a themelios session
# (docs/themelios-gaps.md).
[dependencies]
themelios-program = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "86c7dfb", package = "themelios-program" }

# The dynamic protobuf-descriptor engine — the ingestion path (§20) and the payload
# door's decode engine (§22). Read only through the `descriptor` module — its private
# internals, and the one crate-internal seam `RetainedPool::message_by_name` — and
# the `codec` module's engine adapter (`codec/engine.rs`), which decodes a payload
# against that seam's descriptor and presents it in keryx's own value vocabulary; no
# prost-reflect type escapes into a keryx-core public signature (the descriptor-engine
# boundary).
# Pinned exact (`=`), as themelios pins its coupled parser `rowan` exact for the
# same coupling: the descriptor door's pre-emption catalogue is a statement about
# prost-reflect's *internals* at exactly this version — which shapes it panics on (a
# leading-dot name), its `options()` lazy decode, its unbounded text-format parse
# of an option aggregate — so a silent patch bump could invalidate it; the
# pre-empt catalogue is re-owed on any deliberate bump.
# `text-format` gates the text-format parser the payload door's textproto decode
# calls (`codec/engine.rs::decode_textproto`). protox enables it transitively
# today; it is declared here because keryx-core's own call must not rest on
# another crate's defaults.
# `serde` gates the engine's JSON mapping — `DynamicMessage::deserialize`, which the
# payload door's JSON decode drives with a serde_json deserializer
# (`codec/engine.rs::decode_json`). It brings the engine's own `serde-value` (it
# buffers a well-known type's entries before it reads them) and `base64` (a `bytes`
# field's JSON spelling) in transitively; keryx-core's code names neither, so neither
# is declared — the lockfile pins them, and the feature set is re-owed with the
# pre-empt catalogue on any deliberate bump.
prost-reflect = { version = "=0.16.5", features = ["text-format", "serde"] }

# The JSON deserializer — the payload door's JSON decode drives the engine's `serde`
# mapping with it (`codec/engine.rs::decode_json`), the one place a payload's JSON
# syntax is parsed. Pinned exact (`=`) for the same class of coupling as prost-reflect
# and protox: the JSON form's bounded-depth property (threat model, property 3, branch
# (a)) rests on serde_json's *default* recursion limit — on by default, a constant of
# this version's deserializer, and never lifted (the `unbounded_depth` feature stays
# off, so `disable_recursion_limit` is not so much as compiled in) — a claim about
# serde_json at exactly this version, guarded by a boundary test at the payload door.
# Which binds first, the walk's uniform nesting ceiling or this limit, goes by the
# field's form — a chain of singular message fields reaches the walk's ceiling first;
# a repeated or map chain, spending a container of its own per level, meets this limit
# first — as the JSON form records when it lands. Default features, no more.
serde_json = "=1.0.151"

# The pure-Rust `.proto` compiler — the `keryx gen` front door (§20, spec §31 M1).
# Read only through `descriptor::source`'s private internals; bytes are the seam to
# `ingest`, so protox's prost and keryx's prost-reflect never couple, and no protox
# type reaches a keryx-core public signature (the descriptor-engine boundary).
# Pinned exact (`=`) for the same reason as prost-reflect: the source door mirrors
# protox-parse's lexer state machine and its import-recursion budget is calibrated
# to this version's behaviour, so the mirror is a claim about protox-parse 0.9.0
# (protox 0.9.1's pin) exactly.
protox = "=0.9.1"

# The generated descriptor types and prost decode — used only to *inspect* a serialized
# `FileDescriptorSet` (editions detection) before handing it to the descriptor engine, a
# plain decode that cannot panic the way prost-reflect's pool build does on editions. The
# decoded typed struct is discarded — the pool is still built from the raw bytes — so no
# prost-types struct ever feeds the schema (the §18/§20 rule; the decode itself sits on the
# ingestion path, but its typed result is discarded).
prost = "0.14"
prost-types = "0.14"

[dev-dependencies]
# Fixture compilation shared across the suites lives in one dev-only crate, so no
# suite carries a dead-code allow for a helper it does not use.
keryx-test-support = { path = "../keryx-test-support" }
# Property tests for the stage-1 lowering laws (idempotence, injectivity) — the
# invariants the docs assert, made executable over generated input.
proptest = "1"

[lints]
workspace = true
