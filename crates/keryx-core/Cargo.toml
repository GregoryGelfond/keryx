[package]
name = "keryx-core"
version = "0.1.0"
description = "The solver-free core of keryx: the protobuf-schema-to-ASP-vocabulary compiler and the protobuf-message-to-ground-facts codec, over themelios's Symbol algebra."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# The arm's-length dependency on the themelios program tier, pinned to the
# consolidated rev. themelios is a public repo, so this fetches over HTTPS with
# no credentials. keryx never modifies themelios; gaps go to a themelios session
# (docs/themelios-gaps.md).
[dependencies]
themelios-program = { git = "https://github.com/GregoryGelfond/themelios.git", rev = "86c7dfb", package = "themelios-program" }

# The dynamic protobuf-descriptor engine — the ingestion path (§20). Read only
# through the `descriptor` module's private internals; no prost-reflect type
# escapes into a keryx-core public signature (the descriptor-engine boundary).
# The full patch is named; Cargo.lock (committed) is the exact-pin anchor.
prost-reflect = "0.16.5"

# The pure-Rust `.proto` compiler — the `keryx gen` front door (§20, spec §31 M1).
# Read only through `descriptor::source`'s private internals; bytes are the seam to
# `ingest`, so protox's prost and keryx's prost-reflect never couple, and no protox
# type reaches a keryx-core public signature (the descriptor-engine boundary).
protox = "0.9.1"

[dev-dependencies]
# Fixture compilation shared across the suites lives in one dev-only crate, so no
# suite carries a dead-code allow for a helper it does not use.
keryx-test-support = { path = "../keryx-test-support" }
# Property tests for the stage-1 lowering laws (idempotence, injectivity) — the
# invariants the docs assert, made executable over generated input.
proptest = "1"

[lints]
workspace = true
