syntax = "proto2";
package keryx;

import "google/protobuf/descriptor.proto";

// A foreign extension coined under keryx's OWN package name, by a file that
// does not import the vendored `keryx/options.proto` registry — proves
// options are resolved by extension identity (architecture §6), never by a
// `keryx.`-prefixed name alone. `Evil` is a legal proto field name but not a
// themelios identifier (`Name::new` requires a lowercase-initial identifier),
// so admitting this option by name would panic `schema_facts::render`; identity
// resolution excludes it before it ever reaches an `Annotation`.
extend google.protobuf.FieldOptions {
  optional bool Evil = 60001;
}

message Foreign {
  optional string note = 1 [(keryx.Evil) = true];
}
