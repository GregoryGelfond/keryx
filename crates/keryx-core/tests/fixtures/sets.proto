syntax = "proto3";
package keryx.sets;

import "keryx/options.proto";

// A tag — the element type of a set of messages.
message Tag {
  string label = 1;
}

// A record carrying a scalar set and a message set, both `(keryx.set)`-annotated (spec §7.1):
// each is a membership relation, not a sequence.
message Record {
  repeated string names = 1 [(keryx.set) = true]; // a scalar set: names(P, V)
  repeated Tag tags = 2 [(keryx.set) = true];     // a message set: tags(P, E)
}

// An empty message — the element type of a set whose members carry no field. Because it has no
// field, a member misfiled under a *different* sort would reassemble to a clean (invented) empty
// message unless the reassembler keys its set-member occupancy re-check on the element sort
// (spec §7.1). The element sort with no total field is the shape that shows the difference.
message Empty {}

// A holder of a message set of `Empty`: a member of `items` declared an occupant of a different
// sort (e.g. `tag(·)`, not `empty(·)`) must be refused, never built as an empty `Empty`.
message Holder {
  repeated Empty items = 1 [(keryx.set) = true];
}

// A recursive node whose children are a set of nodes. A message-set member is named by its own
// provenance (spec §7.1), so an answer set can name one occupant a member of many parents — a DAG,
// which the access-path forms forbid by construction. The reassembler must expand such a shape in
// bounded work, refusing a DAG that would expand past the answer set's atom count rather than
// re-expand a shared occupant once per path (exponentially).
message Node {
  repeated Node kids = 1 [(keryx.set) = true];
}

// A message with TWO set fields of the same element type: one occupant can be named a member of both
// fields at once (§7.1, "shared across parents"). The reassembler must build each reference as its
// own instance — a member shared across the two fields reassembles into each, never panicking on a
// double-consumed occupant.
message Pair {
  repeated Node xs = 1 [(keryx.set) = true];
  repeated Node ys = 2 [(keryx.set) = true];
}
