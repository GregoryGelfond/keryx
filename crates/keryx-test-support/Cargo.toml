[package]
name = "keryx-test-support"
version = "0.1.0"
description = "Test-only helpers shared across keryx's suites: compile a fixture .proto to a FileDescriptorSet through protox, keeping the custom-option bytes (§20)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The pure-Rust .proto compiler, to turn a fixture into a serialized FileDescriptorSet.
# This is a dev-dependency library, so its helpers are public API and no suite pays a
# dead-code allow for the ones it does not use. Pinned exact (`=`) to match keryx-core:
# the fixtures compile through the same protox the source door mirrors.
protox = "=0.9.1"
# For hand-building adversarial descriptor sets protoc/protox would never emit — e.g. the
# fault-provoking set that drives a real contained engine fault through `ingest` and the CLI.
prost = "0.14"
prost-types = "0.14"

[lints]
workspace = true
