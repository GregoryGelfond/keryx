name: checks
on:
  push:
  pull_request:

# Read-only workflow token; a compromised action can do no more than read.
permissions:
  contents: read

# The toolchain pin, named once. rust-version = "1.97" in Cargo.toml is the
# floor; this pin is at or above it.
env:
  RUST_TOOLCHAIN: "1.97.1"

jobs:
  gate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal \
            --component llvm-tools
          rustup default "$RUST_TOOLCHAIN"
      - uses: taiki-e/install-action@51c9d223e46ef0189fd65bfe00a28e0de249282c # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov@0.8.7
      # The floor follows themelios's method (measure line coverage, round down to
      # a multiple of five, minus five), raised only deliberately and never lowered.
      - run: cargo llvm-cov --workspace --locked --fail-under-lines 85
